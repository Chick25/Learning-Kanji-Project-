<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kanji Bot Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(135deg, #667eea, #764ba2); 
      min-height: 100vh; 
      color: white; 
      display: flex; 
      flex-direction: column; 
    }
    header { 
      background: rgba(0,0,0,0.3); 
      text-align: center; 
      padding: 30px; 
      font-size: 36px; 
      font-weight: 700; 
    }
    .container { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    .title { 
      font-size: 48px; 
      margin-bottom: 40px; 
      text-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    .selection { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 40px; 
      max-width: 1200px; 
      width: 100%; 
    }
    .card { 
      background: white; 
      color: #333; 
      border-radius: 30px; 
      padding: 45px; 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
      transition: all 0.4s; 
      cursor: pointer; 
    }
    .card:hover { 
      transform: translateY(-20px); 
      box-shadow: 0 40px 80px rgba(0,0,0,0.3); 
    }
    .card-icon { font-size: 90px; margin-bottom: 25px; }
    .card-title { font-size: 32px; font-weight: 700; margin: 20px 0; color: #667eea; }
    .card-desc { font-size: 19px; line-height: 1.6; color: #555; margin-bottom: 20px 0; }
    .play-btn { 
      background: #667eea; 
      color: white; 
      padding: 16px 50px; 
      font-size: 22px; 
      font-weight: 600; 
      border: none; 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .play-btn:hover { background: #764ba2; transform: scale(1.05); }

    .game-area { 
      display: none; 
      background: white; 
      color: #333; 
      border-radius: 30px; 
      padding: 50px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
      width: 100%; 
      max-width: 900px; 
      text-align: center; 
      margin: 30px; 
    }
    #timer { font-size: 38px; font-weight: 700; color: #e91e63; margin: 20px 0; }
    #scores { display: flex; justify-content: space-around; font-size: 30px; margin: 25px 0; }
    #playerScore { color: #1976d2; }
    #botScore { color: #e91e63; }
    #question { font-size: 36px; margin: 40px 0; color: #333; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin: 40px 0; }
    .option { 
      padding: 60px; 
      font-size: 90px; 
      background: #f8f9fa; 
      border-radius: 30px; 
      cursor: pointer; 
      transition: all 0.3s; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
    }
    .option:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .option.correct { background: #d4edda; border: 6px solid #28a745; }
    .option.wrong { background: #f8d7da; border: 6px solid #dc3545; }
    canvas { 
      border: 5px solid #667eea; 
      border-radius: 25px; 
      background: white; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
      margin: 30px 0; 
    }
    .btn-group { margin: 30px 0; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    button { 
      padding: 16px 40px; 
      font-size: 20px; 
      border: none; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    #checkBtn { background: #667eea; color: white; }
    #clearBtn { background: #ff5252; color: white; }
    #undoBtn { background: #ffa000; color: white; }
    #skipBtn { background: #9e9e9e; color: white; }
    button:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.3); }
    #result { 
      font-size: 32px; 
      font-weight: 700; 
      min-height: 80px; 
      margin: 30px 0; 
      padding: 25px; 
      border-radius: 20px; 
      background: #f8f9fa; 
    }
    .final-result { 
      font-size: 42px; 
      color: #e91e63; 
      margin: 40px 0; 
      line-height: 1.6; 
    }
    footer { 
      text-align: center; 
      padding: 20px; 
      background: rgba(0,0,0,0.3); 
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>Kanji Bot Duel</header>

  <div class="container">
    <!-- CHỌN LEVEL -->
    <div id="levelSelection">
      <h1 class="title">Chọn cấp độ</h1>
      <div class="selection">
        <div class="card" onclick="selectLevel('grade-1')">
          <div class="card-icon">1️⃣</div>
          <div class="card-title">Cấp 1</div>
          <div class="card-desc">80 chữ cơ bản</div>
          <button class="play-btn">Chọn</button>
        </div>
        <div class="card" onclick="selectLevel('grade-2')">
          <div class="card-icon">2️⃣</div>
          <div class="card-title">Cấp 2</div>
          <div class="card-desc">160 chữ</div>
          <button class="play-btn">Chọn</button>
        </div>
        <div class="card" onclick="selectLevel('grade-3')">
          <div class="card-icon">3️⃣</div>
          <div class="card-title">Cấp 3</div>
          <div class="card-desc">200 chữ</div>
          <button class="play-btn">Chọn</button>
        </div>
        <div class="card" onclick="selectLevel('grade-4')">
          <div class="card-icon">4️⃣</div>
          <div class="card-title">Cấp 4</div>
          <div class="card-desc">200 chữ</div>
          <button class="play-btn">Chọn</button>
        </div>
        <div class="card" onclick="selectLevel('grade-5')">
          <div class="card-icon">5️⃣</div>
          <div class="card-title">Cấp 5</div>
          <div class="card-desc">185 chữ cao cấp</div>
          <button class="play-btn">Chọn</button>
        </div>
      </div>
    </div>

    <!-- CHỌN CHẾ ĐỘ -->
    <div id="modeSelection" class="hidden">
      <h1 class="title">Chọn chế độ chơi</h1>
      <div class="selection">
        <div class="card" onclick="startGame('match')">
          <div class="card-icon">🔗</div>
          <div class="card-title">Nối Nghĩa</div>
          <div class="card-desc">Bot đưa nghĩa → bạn chọn Kanji đúng</div>
          <button class="play-btn">Chơi</button>
        </div>
        <div class="card" onclick="startGame('write')">
          <div class="card-icon">✍️</div>
          <div class="card-title">Viết Chữ</div>
          <div class="card-desc">Bot đưa nghĩa → bạn viết Kanji</div>
          <button class="play-btn">Chơi</button>
        </div>
      </div>
    </div>

    <!-- GAME PLAY -->
    <div class="game-area" id="gameArea">
      <div id="timer">Thời gian: <span id="timeLeft">60</span>s</div>
      <div id="scores">
        <div id="playerScore">Bạn: <span id="playerPoint">0</span></div>
        <div id="botScore">Bot: <span id="botPoint">0</span></div>
      </div>
      <div id="question"></div>

      <div class="options" id="options"></div>

      <canvas id="canvas" width="400" height="400" class="hidden"></canvas>

      <div class="btn-group hidden">
        <button id="checkBtn">Check</button>
        <button id="clearBtn">Clear</button>
        <button id="undoBtn">Undo</button>
        <button id="skipBtn">Skip (-0.5 point)</button> <!-- NÚT SKIP MỚI -->
      </div>

      <div id="result"></div>
    </div>
  </div>

  <footer>© CTTNHH 2 thành viên</footer>

  <script>
    const levelSelection = document.getElementById("levelSelection");
    const modeSelection = document.getElementById("modeSelection");
    const gameArea = document.getElementById("gameArea");
    const question = document.getElementById("question");
    const resultDiv = document.getElementById("result");
    const timerSpan = document.getElementById("timeLeft");
    const playerPoint = document.getElementById("playerPoint");
    const botPoint = document.getElementById("botPoint");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const optionsDiv = document.getElementById("options");

    let selectedLevel = "";
    let mode = "";
    let allKanjiInLevel = [];
    let currentKanji = "";
    let currentMeaning = "";
    let strokes = [];
    let userStrokes = [];
    let isDrawing = false;
    let currentPoints = [];
    let playerScore = 0;
    let botScore = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let currentStroke = 0;

    const username = localStorage.getItem('username');
    if (!username) {
      alert("Vui lòng đăng nhập!");
      window.location.href = '/login';
    }

    async function loadAllKanjiInLevel(level) {
      const url = `https://kanjiapi.dev/v1/kanji/${level}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        return data;
      } catch {
        question.innerHTML = "Lỗi tải dữ liệu cấp độ";
        return [];
      }
    }

    async function getMeaning(kanji) {
      try {
        const res = await fetch(`https://kanjiapi.dev/v1/kanji/${encodeURIComponent(kanji)}`);
        const data = await res.json();
        return data.meanings?.[0] || "Unknown";
      } catch { return "Kanji"; }
    }

    async function loadStrokes(kanji) {
      const code = kanji.codePointAt(0).toString(16).padStart(5, '0');
      const url = `kanjivg/kanji/${code}.svg`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "image/svg+xml");
        return Array.from(doc.querySelectorAll("path")).map(p => p.getAttribute("d"));
      } catch { return []; }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 60;
      timerSpan.textContent = timeLeft;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      canvas.classList.add('hidden');
      optionsDiv.innerHTML = "";
      document.querySelector('.btn-group').classList.add('hidden');

      let winnerMessage = "";
      if (playerScore > botScore) winnerMessage = "BẠN LÀ NGƯỜI THẮNG CUỘC! I'll comeback, human! ☠️ ";
      else if (botScore > playerScore) winnerMessage = "BOT LÀ NGƯỜI THẮNG CUỘC! You're a chicken! 🍗 ";
      else winnerMessage = "HÒA NHAU! Hai bên ngang tài ngang sức! ⚔️";

      resultDiv.innerHTML = `
        <div class="final-result">
          HẾT GIỜ! ⏰<br><br>
          Điểm bạn: <strong>${playerScore}</strong><br>
          Điểm Bot: <strong>${botScore}</strong><br><br>
          <span style="font-size: 42px;">${winnerMessage}</span>
        </div>
        <button onclick="location.reload()" style="margin-top: 30px; padding: 18px 50px; font-size: 22px; background: #667eea; color: white; border: none; border-radius: 50px;">Chơi lại</button>
      `;
    }

    function selectLevel(level) {
      selectedLevel = level;
      levelSelection.style.display = "none";
      modeSelection.classList.remove('hidden');
    }

    async function startGame(selectedMode) {
      mode = selectedMode;
      modeSelection.style.display = "none";
      gameArea.style.display = "block";

      allKanjiInLevel = await loadAllKanjiInLevel(selectedLevel);
      if (allKanjiInLevel.length === 0) {
        question.innerHTML = "Không tải được dữ liệu cấp độ";
        return;
      }

      playerScore = 0;
      botScore = 0;
      playerPoint.textContent = playerScore;
      botPoint.textContent = botScore;
      startTimer();
      nextRound();
    }

    async function nextRound() {
      currentKanji = allKanjiInLevel[Math.floor(Math.random() * allKanjiInLevel.length)];
      currentMeaning = await getMeaning(currentKanji);
      strokes = await loadStrokes(currentKanji);
      userStrokes = [];
      currentPoints = [];

      question.innerHTML = `Chữ nào có nghĩa là "<strong>${currentMeaning}</strong>"?`;

      if (mode === "match") {
        canvas.classList.add('hidden');
        document.querySelector('.btn-group').classList.add('hidden');
        showMatchOptions();
      } else {
        optionsDiv.innerHTML = "";
        canvas.classList.remove('hidden');
        document.querySelector('.btn-group').classList.remove('hidden');
        clearCanvas();
      }
    }

    async function showMatchOptions() {
      let wrong = allKanjiInLevel.filter(k => k !== currentKanji);
      wrong = wrong.sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [currentKanji, ...wrong].sort(() => 0.5 - Math.random());

      optionsDiv.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("div");
        btn.className = "option";
        btn.textContent = opt;
        btn.onclick = () => playerChooseMatch(opt);
        optionsDiv.appendChild(btn);
      });

      // Bot chơi
      setTimeout(botPlayMatch, 1200);
    }

    function playerChooseMatch(choice) {
      document.querySelectorAll('.option').forEach(o => o.onclick = null);
      document.querySelectorAll('.option').forEach(o => {
        if (o.textContent === currentKanji) o.classList.add('correct');
        if (o.textContent === choice && choice !== currentKanji) o.classList.add('wrong');
      });

      if (choice === currentKanji) {
        playerScore += 10;
        playerPoint.textContent = playerScore;
        resultDiv.innerHTML = `<span style="color:#4caf50">Bạn đúng! +10 điểm</span>`;
      } else {
        resultDiv.innerHTML = `<span style="color:#f44336">Bạn sai! Đáp án: ${currentKanji}</span>`;
      }
      setTimeout(nextRound, 3000);
    }

    function botPlayMatch() {
      const accuracy = 0.7 + (60 - timeLeft) / 60 * 0.25;
      if (Math.random() < accuracy) {
        botScore += 10;
        botPoint.textContent = botScore;
      }
    }

    function skipQuestion() {
      playerScore -= 0.5;
      playerPoint.textContent = playerScore.toFixed(1);
      resultDiv.innerHTML = `<span style="color:#ffa000">Đã skip! -0.5 điểm</span>`;
      setTimeout(nextRound, 2000);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, 400, 400);
      userStrokes = [];
      currentPoints = [];
      resultDiv.innerHTML = "";
    }

    function undoLastStroke() {
      if (userStrokes.length > 0) {
        userStrokes.pop();
        render();
      }
    }

    function checkWrite() {
    if (currentStroke >= strokes.length) {
    resultDiv.innerHTML = `<span class="correct">HOÀN THÀNH CHỮ "${currentKanji}"!</span>`;
    score += 10;
    scoreSpan.textContent = score;
    setTimeout(nextQuestion, 2000);
    return;
    }

    const pathStr = strokes[currentStroke];
    const points = userStrokes[currentStroke] || [];

    if (points.length < 10) {
    resultDiv.innerHTML = `<span class="wrong">Nét quá ngắn!</span>`;
    return;
    }

    const getEndpoints = d => {
    const tokens = d.replace(/,/g,' ').replace(/\s+/g,' ').trim().split(/\s+/);
    let x = 0, y = 0, sx = 0, sy = 0, moved = false, cmd = '';
    for (let t of tokens) {
        if (/[a-zA-Z]/.test(t)) { cmd = t; continue; }
        const nums = tokens.slice(tokens.indexOf(t)).map(parseFloat).filter(n=>!isNaN(n));
        if (!moved && cmd.toUpperCase() === 'M') { sx = x = nums[0]; sy = y = nums[1]||y; moved = true; }
        if (cmd === 'c' || cmd === 'C') {
        const dx = cmd === 'c' ? nums[nums.length-2] : 0;
        const dy = cmd === 'c' ? nums[nums.length-1] : 0;
        x = cmd === 'C' ? nums[nums.length-2] : x + dx;
        y = cmd === 'C' ? nums[nums.length-1] : y + dy;
        }
    }
    return {start: {x:sx,y:sy}, end: {x,y}};
    };

    const model = getEndpoints(pathStr);
    const userVec = { dx: points[points.length-1].x - points[0].x, dy: points[points.length-1].y - points[0].y };
    const modelVec = { dx: model.end.x - model.start.x, dy: model.end.y - model.start.y };
    const dot = (modelVec.dx * userVec.dx + modelVec.dy * userVec.dy) /
                (Math.hypot(modelVec.dx, modelVec.dy) * Math.hypot(userVec.dx, userVec.dy));

    if (dot < -0.3) {
    resultDiv.innerHTML = `<span class="wrong">Sai hướng nét ${currentStroke + 1}!</span>`;
    return;
    }

    const tempCtx = document.createElement("canvas").getContext("2d");
    tempCtx.lineWidth = 22;
    let match = 0;
    for (let p of points) {
    const x = (p.x - 90) / 2;
    const y = (p.y - 90) / 2;
    if (tempCtx.isPointInStroke(new Path2D(pathStr), x, y)) match++;
    }
    const ratio = match / points.length;

    if (ratio >= 0.35) {
    // resultDiv.innerHTML = `<span class="correct">Đúng nét ${currentStroke + 1}!</span>`;
    currentStroke++;
    if (currentStroke === strokes.length){
      resultDiv.innerHTML = `<span class="correct">Good</span>`
    }else{
      resultDiv.innerHTML = `<span class="correct">Nah ah</span>`
    }
    render();
    setTimeout(() => resultDiv.innerHTML = "", 1000);
    } else {
    resultDiv.innerHTML = `<span class="wrong">Chưa đúng nét ${currentStroke + 1} (${(ratio*100).toFixed(0)}%)</span>`;
    }

      // Sau khi chấm
      if (isCorrect) {
        playerScore += 15;
        playerPoint.textContent = playerScore;
      }

      // Bot chơi (random đúng 70-95%)
      if (Math.random() < (0.7 + (60 - timeLeft) / 60 * 0.25)) {
        botScore += 15;
        botPoint.textContent = botScore;
      }

      setTimeout(nextRound, 3000);
    }

    function render() {
      ctx.clearRect(0, 0, 400, 400);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";

      userStrokes.forEach(stroke => {
        if (stroke.length > 0) {
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          stroke.forEach(p => ctx.lineTo(p.x, p.y));
          ctx.stroke();
        }
      });

      if (currentPoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
        currentPoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();
      }
    }

    // VẼ
    canvas.addEventListener("mousedown", e => {
      isDrawing = true;
      currentPoints = [];
      const rect = canvas.getBoundingClientRect();
      currentPoints.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    });

    canvas.addEventListener("mousemove", e => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      currentPoints.push({x, y});
      render();
    });

    canvas.addEventListener("mouseup", () => {
      if (isDrawing && currentPoints.length > 0) {
        userStrokes.push(currentPoints);
        render();
      }
      isDrawing = false;
    });

    document.getElementById("checkBtn").onclick = checkWrite;
    document.getElementById("clearBtn").onclick = clearCanvas;
    document.getElementById("undoBtn").onclick = undoLastStroke;
    document.getElementById("skipBtn").onclick = skipQuestion;
  </script>
</body>
</html>
