<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viết Chữ Kanji</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tsk/writegame/style_writegame.css">
</head>
<body>

  <header>
    <p>Learning Kanji</p>
  </header>

  <div class="underheader">
    <h1>Kanji Writing Game</h1>
    <div class="user_icon">
      <a href="/profile" id="userIcon">
        <img src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="user" id="preview"/>
      </a>
    </div>
  </div>

  <div class="container">
    <div id="controls" class="controls">
      <select id="grade-select">
        <option value="grade-1">Grade 1</option>
        <option value="grade-2">Grade 2</option>
        <option value="grade-3">Grade 3</option>
        <option value="grade-4">Grade 4</option>
        <option value="grade-5">Grade 5</option>
      </select>
    </div>

    <div class="center">
      <div id="meaningBox">Chọn cấp độ để bắt đầu</div>
      <canvas id="canvas" width="400" height="400"></canvas>
      <div id="result"></div>

      <div class="btn-group">
        <button id="checkBtn">Check</button>
        <button id="clearBtn">Clear</button>
        <button id="undoBtn">Undo nét</button>
        <button id="skipBtn">Bỏ qua</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© CTTNHH 2 thành viên</p>
  </footer>

  <script src="/tsk/writegame/script_writegame.js"></script>
</body>
</html>
