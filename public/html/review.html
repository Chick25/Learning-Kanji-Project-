<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Review Chữ Đã Học</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #71A95A;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
    }
    .container {
      flex: 1;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .mode-select {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .mode-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      background: white;
      border: 2px solid #71A95A;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .mode-btn.active, .mode-btn:hover {
      background: #71A95A;
      color: white;
    }
    #quizArea {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .meaning {
      font-size: 28px;
      margin: 20px 0;
      font-weight: 600;
      color: #71A95A;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    .option {
      padding: 16px;
      font-size: 24px;
      background: #f0f0f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option:hover { background: #e0e0e0; }
    .option.correct { background: #d4edda; border: 2px solid #28a745; }
    .option.wrong { background: #f8d7da; border: 2px solid #dc3545; }

    canvas {
      border: 3px dashed #aaa;
      background: white;
      margin: 20px auto;
      display: block;
    }
    #result { font-size: 20px; margin: 20px 0; font-weight: 600; }
    button#nextBtn, button#backBtn {
      margin: 20px 10px;
      padding: 12px 24px;
      background: #71A95A;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    }
    button#backBtn {
      background: #6c757d;
    }
  </style>
</head>
<body>
  <header>Review Chữ Đã Học</header>
  <div class="container">
    <div class="mode-select">
      <button class="mode-btn active" data-mode="choice">Chọn chữ theo nghĩa</button>
      <button class="mode-btn" data-mode="draw">Viết chữ theo nghĩa</button>
    </div>

    <div id="quizArea">
      <p id="status">Đang tải dữ liệu...</p>
    </div>
  </div>

  <script>
    const username = localStorage.getItem('username');
    if (!username) window.location.href = '/login';

    let learnedKanji = [];
    let currentQuestion = 0;
    let mode = 'choice';

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        startQuiz();
      });
    });

    async function loadLearnedKanji() {
      const res = await fetch(`/learn?username=${username}&level=grade-1`);
      const data = await res.json();
      learnedKanji = data.progress || [];
      if (learnedKanji.length < 4) {
        document.getElementById('quizArea').innerHTML = `<p>Bạn cần học ít nhất 4 chữ để Review!</p><button onclick="window.location.href='/'">Quay lại</button>`;
      } else {
        startQuiz();
      }
    }

    async function getMeaning(kanji) {
      const res = await fetch(`https://kanjiapi.dev/v1/kanji/${encodeURIComponent(kanji)}`);
      const data = await res.json();
      return data.meanings ? data.meanings[0] : "Unknown";
    }

    async function startQuiz() {
      currentQuestion = 0;
      showQuestion();
    }

    async function showQuestion() {
      if (currentQuestion >= 10) {
        document.getElementById('quizArea').innerHTML = `<h2>Hoàn thành Review!</h2><button onclick="window.location.href='/profile'">Quay lại Profile</button>`;
        return;
      }

      const correctKanji = learnedKanji[Math.floor(Math.random() * learnedKanji.length)];
      const wrongOptions = learnedKanji
        .filter(k => k !== correctKanji)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3);

      const options = [correctKanji, ...wrongOptions].sort(() => 0.5 - Math.random());
      const meaning = await getMeaning(correctKanji);

      if (mode === 'choice') {
        let html = `<div class="meaning">${meaning}</div><div class="options">`;
        options.forEach(opt => {
          html += `<div class="option" onclick="selectOption('${opt}', '${correctKanji}')">${opt}</div>`;
        });
        html += `</div><div id="result"></div>`;
        document.getElementById('quizArea').innerHTML = html;
      } else {
        document.getElementById('quizArea').innerHTML = `
          <div class="meaning">Viết chữ có nghĩa: <strong>${meaning}</strong></div>
          <canvas id="drawCanvas" width="400" height="400"></canvas>
          <button onclick="checkDrawing('${correctKanji}')">Kiểm tra</button>
          <div id="result"></div>
        `;
        setupDrawingCanvas(correctKanji);
      }
    }

    function selectOption(selected, correct) {
      document.querySelectorAll('.option').forEach(opt => {
        opt.className = opt.textContent === correct ? 'option correct' : 'option wrong';
        opt.onclick = null;
      });
      document.getElementById('result').innerHTML = selected === correct ?
        "Đúng rồi!" : `Sai! Đáp án đúng là: ${correct}`;
      setTimeout(() => { currentQuestion++; showQuestion(); }, 2000);
    }

    // === CHẾ ĐỘ VIẾT CHỮ (dùng lại logic checkResult của bạn) ===
    let drawingPoints = [];
    function setupDrawingCanvas(correctKanji) {
      const canvas = document.getElementById('drawCanvas');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        drawingPoints.push({x, y});
        ctx.lineTo(x, y);
        ctx.stroke();
      });
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mouseleave', () => isDrawing = false);
    }

    window.checkDrawing = async function(correctKanji) {
      // Dùng lại logic kiểm tra nét của bạn ở đây (gọi API hoặc copy hàm)
      document.getElementById('result').innerHTML = "Đang chấm... (chức năng đang phát triển)";
      setTimeout(() => {
        document.getElementById('result').innerHTML = "Đúng!";
        currentQuestion++;
        showQuestion();
      }, 1500);
    }

    loadLearnedKanji();
  </script>
</body>
</html>
