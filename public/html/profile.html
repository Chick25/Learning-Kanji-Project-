<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f4f6f8;
        color: #333;
    }
    
    header{
      background-color: #71A95A;
      padding: 18px 25px;
      text-align: left;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    main {
        flex: 1; /* Đẩy footer xuống dưới */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .profile-container {
        /* max-width: 420px; */
        min-height: 70vh;
        width: 100%;
        height: auto;
        background: white;
        padding: 25px 20px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        text-align: center;
        transition: transform 0.2s;
    }

    .profile-container:hover {
        transform: translateY(-5px);
    }

    .user_icon img{
      object-fit: cover;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #71A95A;
      margin-bottom: 10px;
      transition: transform 0.3s;
    }
    .user_icon img:hover{
      transform: scale(1.05);
    }

    #username{
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #444;
    }

    .level-select {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        gap: 8px;
    }
    .level-select span {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        background: #e8f5e9;
        color: #71A95A;
        font-weight: 500;
        text-align: center;
        font-size: 14px;
        transition: all 0.3s;
        cursor: pointer;
    }
    .level-select span:hover{
        background: #71A95A;
        color: #fff;
    }

    .progress-section {
        margin-top: 15px;
    }

    .progress-bar {
        background: #eee;
        border-radius: 12px;
        overflow: hidden;
        height: 14px;
        margin-bottom: 8px;
    }
    .progress-fill {
        background: linear-gradient(90deg, #71A95A, #9ccc65);
        height: 100%;
        width: 0%; /* Tiến độ */
        transition: width 0.5s ease-in-out;
    }
    .progress-text {
        font-size: 14px;
        font-weight: 500;
        color: #555;
    }

    footer{
        background-color: #323232;
        padding: 20px;
        text-align: center;
    }
    footer p{
      font-size: 14px;
      color: #fdf6ec;
    }

    .logout-wrap {
    display: flex;
    justify-content: flex-end; /* đẩy nút sang phải */
    padding: 15px 25px;
    background: #f4f6f8; /* cùng màu nền để không lộ */
    }

    /* 🔥 Nút Logout cố định góc dưới bên phải */
    .logout-btn {
        /* position: fixed; */
        
        width: 10%;
        background: #ff4d4d;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        transition: background 0.3s ease;
        }
    .logout-btn:hover {
        background: #e63939;
    }
    #fileInput{
      display: none;
    }
    /* Responsive */
    @media (max-width: 480px) {
        .profile-container {
            padding: 20px 15px;
        }
        .user_icon img {
            width: 70px;
            height: 70px;
        }
        #username {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

  <header>
    Learning Kanji
  </header>

  <main>
    <div class="profile-container">
      <div class="user_icon">
        <a id="userIcon">
          <img src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="user_img" id="preview"/>
          <input type="file" id="fileInput" accept="image/*">
        </a>
      </div>
      <p id="username"></p>

      <div class="level-select">
          <span id='grade-1'>N5</span>
          <span id='grade-2'>N4</span>
          <span id='grade-3'>N3</span>
          <span id='grade-4'>N2</span>
          <span id='grade-5'>N1</span>
      </div>

      <div class="learned">
        <p id=kanjiLearned></p>
      </div>

      <div class="progress-section">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Tiến độ: </p>
      </div>
    </div>
  </main>

  <!-- ✅ Nút Logout cố định -->
  <div class="logout-wrap">
    <button id="btnLogout" class="logout-btn">Đăng xuất</button>
  </div>

  <footer>
    <p>© 2025 - CTTNHH 2 thành viên</p>
  </footer>

<script>

  const username = localStorage.getItem('username');
  document.addEventListener('DOMContentLoaded', ()=>{
 
    const logoutBtn = document.getElementById('btnLogout');
   
    if(username){
      document.getElementById('username').textContent = username;
    }else{
      window.location.href='/login';
    }

    // Xử lý logout
    logoutBtn.addEventListener('click', ()=>{
      localStorage.removeItem('username');
      window.location.href='/login';
    });
  });

  // function displaKanjiLearned(){
  //   const kanjiLearned = document.getElementById('kanjiLearned');

  // }
  const kanjiLearned = document.getElementById('kanjiLearned');

  const progressText = document.getElementById('progressText');

  const progressFill = document.getElementById('progressFill');

  document.addEventListener('DOMContentLoaded', ()=>{
   
    const levels = document.querySelectorAll('.level-select span');

    levels.forEach(level =>{
      level.addEventListener('click', ()=>{
        kanjiLearned.textContent = level.textContent;
        
        Promise.all([
          fetch(`https://kanjiapi.dev/v1/kanji/${level.id}`)
            .then(res=>{
              if(!res.ok){
                throw new Error('Error!');
              }
              return res.json()
            }),
          fetch(`http://localhost:3000/learn?username=${encodeURIComponent(username)}&level=${encodeURIComponent(level.id)}`) 

            .then(res=>{
              if(!res.ok){
                throw new Error('Error!');
              }
              return res.json()
            })
          ])    
          .then(([data1, data2])=>{
              
            progressText.textContent = `Tiến độ: ${data2.progress}/${data1.length}`;
            // console.log(data1)
            progressFill.style.height = `${data1.length}%`;
            progressFill.style.width = `${data2.progress}%`
          })
          .catch(error => {
            console.error("Có lỗi:", error.message);
          })
       
        

      })
    })
  });

const fileInput = document.getElementById('fileInput');
const img = document.getElementById('preview');

const savedImage = localStorage.getItem('profileImage');
if(savedImage){
  img.src = savedImage;
}



img.addEventListener('click', ()=>{
  fileInput.click();
});

fileInput.addEventListener('change', (event)=>{
  const file = event.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = (e) =>{
      img.src = e.target.result;
      localStorage.setItem('profileImage', e.target.result);
    };
    reader.readAsDataURL(file);
  }
});

</script>

</body>
</html>
