<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_profile.css">
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
    }

    body {
        font-family: 'Yu Mincho', 'Noto Serif JP', 'MS Mincho', serif;
        background: #f4f6f8;
        color: #000000;
    }
    
   header{
  background-color: #71A95A;
  padding: 15px;
  z-index: 2000;
}

header p{
  font-weight: 500;
  font-size: 30px;
  margin: 0;
  margin-left: 15px;
}

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .profile-container {
        min-height: 70vh;
        width: 100%;
        height: auto;
        background: white;
        padding: 25px 20px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        text-align: center;
        transition: transform 0.2s;
    }

    .profile-container:hover {
        transform: translateY(-5px);
    }

    .user_icon img{
      object-fit: cover;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #71A95A;
      margin-bottom: 10px;
      transition: transform 0.3s;
    }
    .user_icon img:hover{
      transform: scale(1.05);
    }

    #username{
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #444;
    }

    .level-select {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        gap: 8px;
    }
    .level-select span {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        background: #e8f5e9;
        color: #71A95A;
        font-weight: 500;
        text-align: center;
        font-size: 14px;
        transition: all 0.3s;
        cursor: pointer;
    }
    .level-select span:hover{
        background: #71A95A;
        color: #fff;
    }
    .level-select span.active {
        background: #71A95A;
        color: white;
    }

    .progress-section {
        margin-top: 15px;
    }

    .progress-bar {
        background: #eee;
        border-radius: 12px;
        overflow: hidden;
        height: 14px;
        margin-bottom: 8px;
    }
    .progress-fill {
        background: linear-gradient(90deg, #71A95A, #9ccc65);
        height: 100%;
        width: 0%;
        transition: width 0.5s ease-in-out;
    }
    .progress-text {
        font-size: 14px;
        font-weight: 500;
        color: #555;
    }

    .returnBtn{
      font-size: 30px;
      position: absolute;
      top: 50%;
      left: 20px;
      width: 20px;
      height: 20px;
      opacity: 0.5;
    }

  footer{
  background-color: #323232;
  padding: 30px;
}
footer p{
  font-size: large;
  color: #fdf6ec;
  margin: 0;
}

    .logout-wrap {
        display: flex;
        justify-content: flex-end;
        padding: 15px 25px;
        background: #f4f6f8;
    }

    .logout-btn {
        width: 10%;
        background: #ff4d4d;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        transition: background 0.3s ease;
    }
    .logout-btn:hover {
        background: #e63939;
    }
    #fileInput{
      display: none;
    }

    .review-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 55px !important;
        padding: 10px 0;
    }

    .review-btn {
        padding: 16px 40px;
        font-size: 18px;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, #71A95A, #9ccc65);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(113, 169, 90, 0.35);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        min-width: 240px;
    }

    .review-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 25px rgba(113, 169, 90, 0.45);
        background: linear-gradient(135deg, #5d8c4a, #7aa556);
    }

    /* PHẦN HIỂN THỊ CHỮ ĐÃ HỌC */
    .kanji-display {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px dashed #ccc;
    }
    .kanji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 12px;
        margin-top: 15px;
        justify-items: center;
    }
    .kanji-box {
        width: 60px;
        height: 60px;
        background: #f8f9fa;
        border: 2px solid #ddd;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
        color: #333;
        box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        transition: all 0.3s;
    }
    .kanji-box:hover {
        transform: scale(1.15);
        border-color: #71A95A;
        box-shadow: 0 6px 15px rgba(113,169,90,0.2);
    }
    .no-kanji {
        font-size: 15px;
        color: #888;
        margin-top: 20px;
    }

    /* Responsive */
    @media (max-width: 575.98px) {
        .profile-container {
            padding: 20px 15px;
        }
        .user_icon img {
            width: 70px;
            height: 70px;
        }
        #username {
            font-size: 18px;
        }
        header{
          padding: 20px;
        }
        .logout-btn{
          width: 150px;
        }
        footer{
          height: 150px;
        }
        .kanji-grid {
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 10px;
        }
        .kanji-box {
            width: 50px;
            height: 50px;
            font-size: 26px;
        }
    }
</style>
</head>
<body>

  <header><p>Learning Kanji</p></header>

  <main>
    <div class="profile-container">
      <div class="user_icon">
        <a id="userIcon">
          <img src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="user_img" id="preview"/>
          <input type="file" id="fileInput" accept="image/*">
        </a>
      </div>
      <p id="username"></p>

      <div class="streak-container">
        <div class="streak-box">
          🔥 <strong>Chuỗi học:</strong> <span id="streakCount">0</span> ngày
          <span id="streakMessage"></span>
        </div>
      </div>

      <div class="level-select">
          <span id='grade-1'>N5</span>
          <span id='grade-2'>N4</span>
          <span id='grade-3'>N3</span>
          <span id='grade-4'>N2</span>
          <span id='grade-5'>N1</span>
      </div>

      <div class="progress-section">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Tiến độ: </p>
      </div>
      
      <!-- PHẦN HIỂN THỊ CHỮ ĐÃ HỌC -->
      <div class="kanji-display" id="kanjiDisplay">
        <div id="kanjiContainer" class="kanji-grid"></div>
        <p class="no-kanji" id="noKanjiMsg">Bạn chưa học chữ nào ở cấp độ này.</p>
      </div>

    </div>
  </main>

  <span id="returnBtn" class="returnBtn">&#8592;</span>

  <div class="logout-wrap">
    <button id="btnLogout" class="logout-btn">Đăng xuất</button>
  </div>

  <footer>
    <p>CTTNHH 2 THÀNH VIÊN</p>
  </footer>

<script>
  const returnBtn = document.getElementById('returnBtn');
  returnBtn.addEventListener('click', () => {
    window.location.href = '/';
  });

  const username = localStorage.getItem('username');
  document.addEventListener('DOMContentLoaded', () => {
    const logoutBtn = document.getElementById('btnLogout');

    if (username) {
      document.getElementById('username').textContent = username;
    } else {
      window.location.href = '/login';
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('username');
      window.location.href = '/login';
    });

    // XỬ LÝ CHỌN LEVEL VÀ HIỂN THỊ CHỮ ĐÃ HỌC
    const levels = document.querySelectorAll('.level-select span');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const kanjiContainer = document.getElementById('kanjiContainer');
    const noKanjiMsg = document.getElementById('noKanjiMsg');

    levels.forEach(level => {
      level.addEventListener('click', async () => {
        // Highlight level đang chọn
        levels.forEach(l => l.classList.remove('active'));
        level.classList.add('active');

        const levelId = level.id; // grade-1, grade-2,...

        try {
          const [kanjiRes, progressRes] = await Promise.all([
            fetch(`https://kanjiapi.dev/v1/kanji/${levelId}`),
            fetch(`/api/progress?username=${encodeURIComponent(username)}`)
          ]);

          if (!kanjiRes.ok || !progressRes.ok) throw new Error("Lỗi tải dữ liệu");

          const kanjiData = await kanjiRes.json();
          const progressData = await progressRes.json();

          const totalKanji = kanjiData.length;
          const learnedInLevel = progressData.progress?.[levelId] || [];
          const learnedCount = learnedInLevel.length;

          // Cập nhật tiến độ
          progressText.textContent = `Tiến độ: ${learnedCount}/${totalKanji}`;
          progressFill.style.width = totalKanji > 0 ? `${(learnedCount / totalKanji) * 100}%` : '0%';

          // Hiển thị chữ đã học
          kanjiContainer.innerHTML = "";
          if (learnedCount === 0) {
            noKanjiMsg.style.display = "block";
          } else {
            noKanjiMsg.style.display = "none";
            learnedInLevel.forEach(kanji => {
              const box = document.createElement('div');
              box.className = 'kanji-box';
              box.textContent = kanji;
              kanjiContainer.appendChild(box);
            });
          }
        } catch (err) {
          console.error(err);
          progressText.textContent = "Lỗi tải dữ liệu";
          kanjiContainer.innerHTML = "";
          noKanjiMsg.textContent = "Không thể tải dữ liệu cấp độ";
          noKanjiMsg.style.display = "block";
        }
      });
    });

    // Load mặc định level đầu tiên (N5)
    document.getElementById('grade-1').click();
  });

  // XỬ LÝ ẢNH ĐẠI DIỆN
  const fileInput = document.getElementById('fileInput');
  const img = document.getElementById('preview');

  const savedImage = localStorage.getItem('profileImage');
  if (savedImage) {
    img.src = savedImage;
  }

  img.addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        img.src = e.target.result;
        localStorage.setItem('profileImage', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  });

(function() {
  const today = new Date().toISOString().split('T')[0];
  let streakData = JSON.parse(localStorage.getItem('kanji_streak') || '{}');

  let hasActivityToday = false; // Chỉ true khi thực sự hoàn thành hoạt động

  // Chỉ tính streak nếu có hoạt động hợp lệ (gọi từ game)
  // Reload trang profile KHÔNG được tính là hoạt động

  if (streakData.lastActivityDate === today) {
    // Đã có hoạt động hôm nay (từ game gọi completeStreakUpdate)
    hasActivityToday = true;
  } else if (streakData.lastActivityDate) {
    const diffDays = Math.floor((new Date(today) - new Date(streakData.lastActivityDate)) / 86400000);

    if (diffDays === 1) {
      streakData.count += 1;
      hasActivityToday = true;
    } else if (diffDays > 1) {
      streakData.count = 1;
      hasActivityToday = true;
    }
  } else {
    // Lần đầu – chờ hoạt động thực sự
    streakData.count = 0;
  }

  // CHỈ LƯU lastActivityDate KHI CÓ HOẠT ĐỘNG THỰC SỰ
  // (Reload profile không lưu)
  if (hasActivityToday) {
    streakData.lastActivityDate = today;
    localStorage.setItem('kanji_streak', JSON.stringify(streakData));
  }

  // Hiển thị
  const countEl = document.getElementById('streakCount');
  const boxEl = document.querySelector('.streak-box');
  const msgEl = document.getElementById('streakMessage');

  if (countEl && boxEl && msgEl) {
    countEl.textContent = streakData.count || 0;

    boxEl.classList.remove('dimmed', 'streak-milestone');
    msgEl.textContent = "";
    msgEl.classList.remove('streak-warning');

    // Nếu chưa có hoạt động hôm nay → xám + cảnh báo
    if (streakData.lastActivityDate !== today) {
      boxEl.classList.add('dimmed');
      msgEl.textContent = "⚠️ Học hôm nay để giữ chuỗi!";
      msgEl.classList.add('streak-warning');
    } else {
      // Đã học hôm nay → hiệu ứng đẹp
      if (streakData.count >= 100) {
        boxEl.classList.add('streak-milestone');
        msgEl.textContent = "🏆 THẦN THÁNH!";
      } else if (streakData.count >= 50) {
        boxEl.classList.add('streak-milestone');
        msgEl.textContent = "🌟 HUYỀN THOẠI!";
      } else if (streakData.count >= 30) {
        boxEl.classList.add('streak-milestone');
        msgEl.textContent = "💪 SIÊU PHÀM!";
      } else if (streakData.count >= 10) {
        msgEl.textContent = "🚀 Tuyệt vời!";
      } else if (streakData.count >= 3) {
        msgEl.textContent = "Giữ vững nhé!";
      }
    }
  }
})();

// Hàm này chỉ được gọi từ game khi hoàn thành hoạt động
window.completeStreakUpdate = function() {
  // Force update streak với hoạt động hôm nay
  const today = new Date().toISOString().split('T')[0];
  let streakData = JSON.parse(localStorage.getItem('kanji_streak') || '{}');

  if (streakData.lastActivityDate !== today) {
    // Tính lại streak như bình thường
    if (!streakData.lastActivityDate) {
      streakData.count = 1;
    } else {
      const diffDays = Math.floor((new Date(today) - new Date(streakData.lastActivityDate)) / 86400000);
      if (diffDays === 1) {
        streakData.count += 1;
      } else if (diffDays > 1) {
        streakData.count = 1;
      }
    }
    streakData.lastActivityDate = today;
    localStorage.setItem('kanji_streak', JSON.stringify(streakData));
  }

  // Reload hoặc update trực tiếp nếu cần
  location.reload(); // Đơn giản nhất: reload để thấy thay đổi
};
</script>

</body>
</html>
