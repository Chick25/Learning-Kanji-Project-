<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanji Writing Practice (API)</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header>
    <p>Learning Kanji</p>
  </header>
  <div class="underheader">
    <h1>Kanji Writing Practice</h1>
    <div class="user_icon">
      <a href="#" id="userIcon">
        <img src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="user_img" id="preview"/>
        <!-- <input type="file" id="fileInput" accept="image/*"> -->
      </a>
    </div>
  </div>
  

  <div class="container">
    
    <div class="left" id="sidebar">
      <button id="toggleSidebar" class="toggle-btn">📂</button>
      <h3>Menu</h3>
      <ul>
        <li><a href="/word_connect_game">Matching Kanji Learned</a></li>
        <li><a href="/write_game">Writing All Kanji</a></li>
        <li><a href="/botgame">Game With Bot</a></li>
        <li><a href="/gamenoichu">Writing Kanji Learned</a></li>
        <li><a href="/game2">Matching All Kanji</a></li>
      </ul>

    </div>

    <div id="combiCharacter">combination</div>
    <div id="animContainer">Chọn chữ Kanji để xem nét viết</div>
    <div id="animCharacter">animation </div>

    <div class="center">
      <div style="position: relative; display: inline-block;">
        <canvas id="canvas" width="400" height="400"></canvas>
      <div id="crosshair"></div>
    </div>
  
    <div class="meaningContainer">
      <div id="meaningBox"></div>
      <div id="speaker">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_cVylssdWwa8Z6d0_gE3btlYpdc0r0PF7OA&s" alt="speaker icon" class="speaker-icon">
        <div id="speaker-audio"></div>
      </div>
    </div>
      <!-- <div id="meaningBox"></div> -->
      <div id="readingBox"></div>
      <br>
      <button onclick="checkResult()">✅ Check Answer</button>
      <button onclick="clearCanvas()">❌ Clear Drawing</button>
      <div id="result"></div>
    </div>

    <div class="right">
      <div class="rightheader">
        <h3>Select Level</h3>
        <select id="levelSelect" class="levelSelect" onchange="loadKanjiByLevel()">
          <!-- <option value="">-- Chọn cấp độ --</option> -->
          <option value="grade-1">N5 (Grade 1)</option>
          <!-- <option value="grade-1">N5 (Grade 2)</option> -->
          <option value="grade-2">N4 (Grade 2)</option>
          <option value="grade-3">N3 (Grade 3)</option>
          <option value="grade-4">N2 (Grade 4)</option>
          <option value="grade-5">N1 (Grade 5)</option>
        </select>
        <button onclick="randomKanji()">🔀 Random</button>
      </div>
      <div class="kanji-grid" id="kanjiGrid"></div>
    </div>
  </div>

  <footer>
    <p>CTTNHH 2 thanh vien</p>
  </footer>


  <!-- Thư viện chuyển kana -> romaji -->
  
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.0.2/wanakana.min.js"></script>
  <script src="../script.js"></script>



</body>
</html>
